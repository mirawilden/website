name: Rebuild Kindercover upload

on:
  push:
    branches:
      - cover-upload-20261012

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild covers when upload is complete
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp-kindercover-upload/READY ]; then
            echo "Upload not complete yet."
            exit 0
          fi
          mkdir -p public/assets/images
          for n in band1 band2 band3; do
            cat .tmp-kindercover-upload/${n}/part-* | base64 -d > /tmp/${n}.webp
          done
          echo "435817f37ad9a54cc50b732df54c7c79949e6a1225f1871ec6eb952292d0f028  /tmp/band1.webp" | sha256sum -c -
          echo "172440b822f62bfc02e38b790dfd38030894defda569129f7be1c8ef4c1ca6f4  /tmp/band2.webp" | sha256sum -c -
          echo "c48c148932cfd386b948b490eb365de8c68bac10e10e8fc2e9b9203c27779167  /tmp/band3.webp" | sha256sum -c -
          cp /tmp/band1.webp public/assets/images/die-katzen-vom-katzenbuckel-die-glocke-im-nebel.webp
          cp /tmp/band2.webp public/assets/images/die-katzen-vom-katzenbuckel-die-spur-der-sieben-schlaege.webp
          cp /tmp/band3.webp public/assets/images/die-katzen-vom-katzenbuckel-die-verschwundene-schulgeschichte.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/*.webp
          git rm -r .tmp-kindercover-upload
          git rm .github/workflows/rebuild-kindercover-upload.yml
          git commit -m "Replace Kinderkatzen covers with optimized WebP files"
          git push origin HEAD:cover-upload-20261012
