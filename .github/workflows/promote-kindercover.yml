name: Promote Kinderkatzen covers

on:
  push:
    branches:
      - cover-upload-20261012

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for validated cover build and promote to main
        shell: bash
        run: |
          set -euo pipefail
          P1='public/assets/images/die-katzen-vom-katzenbuckel-die-glocke-im-nebel.webp'
          P2='public/assets/images/die-katzen-vom-katzenbuckel-die-spur-der-sieben-schlaege.webp'
          P3='public/assets/images/die-katzen-vom-katzenbuckel-die-verschwundene-schulgeschichte.webp'
          ready=0
          for i in $(seq 1 36); do
            git fetch origin cover-upload-20261012
            ok=1
            for p in "$P1" "$P2" "$P3"; do
              if ! git cat-file -e "origin/cover-upload-20261012:$p" 2>/dev/null; then ok=0; break; fi
              size=$(git cat-file -s "origin/cover-upload-20261012:$p")
              echo "$p -> $size bytes"
              if [ "$size" -lt 100000 ]; then ok=0; break; fi
            done
            if [ "$ok" -eq 1 ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Validated covers did not appear on upload branch.' >&2
            exit 1
          fi
          mkdir -p /tmp/kindercover
          git show "origin/cover-upload-20261012:$P1" > /tmp/kindercover/band1.webp
          git show "origin/cover-upload-20261012:$P2" > /tmp/kindercover/band2.webp
          git show "origin/cover-upload-20261012:$P3" > /tmp/kindercover/band3.webp
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/kindercover/band1.webp "$P1"
          cp /tmp/kindercover/band2.webp "$P2"
          cp /tmp/kindercover/band3.webp "$P3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$P1" "$P2" "$P3"
          if git diff --cached --quiet; then
            echo 'Main already has these covers.'
          else
            git commit -m 'Replace Kinderkatzen covers with optimized WebP files'
            git push origin HEAD:main
          fi
      - name: Clean temporary promotion workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cover-upload-20261012
          git checkout -B cover-upload-20261012 origin/cover-upload-20261012
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/promote-kindercover.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean temporary Kindercover promotion workflow'
            git push origin HEAD:cover-upload-20261012
          fi
